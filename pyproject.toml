[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-dataforseo-kit"
version = "0.3.0"
description = "Agent-neutral Python client and CLI for DataForSEO API v3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "avalonreset"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/avalonreset/legends-dataforseo-kit"
Issues = "https://github.com/avalonreset/legends-dataforseo-kit/issues"

[project.scripts]
legends-dataforseo = "legends_dataforseo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legends_dataforseo = ["routes.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
