[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-dataforseo-kit"
version = "0.1.2"
description = "Agent-neutral Python client and CLI for DataForSEO API v3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "avalonreset"}]
dependencies = []
keywords = ["dataforseo", "serp", "google-maps", "keyword-research", "seo", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/avalonreset/legends-dataforseo-kit"
Issues = "https://github.com/avalonreset/legends-dataforseo-kit/issues"
Documentation = "https://github.com/avalonreset/legends-dataforseo-kit/tree/main/docs"
Changelog = "https://github.com/avalonreset/legends-dataforseo-kit/blob/main/CHANGELOG.md"
Releases = "https://github.com/avalonreset/legends-dataforseo-kit/releases"

[project.scripts]
legends-dataforseo = "legends_dataforseo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1,<2", "twine>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legends_dataforseo = ["routes.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
